<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ OMAN 237 | PREMIER MEDIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #FFD700; }
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-heading { font-family: 'Syncopate', sans-serif; text-transform: uppercase; }
        .bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 10% 10%, #050505 0%, #000 60%), radial-gradient(circle at 90% 90%, #0a0a0a 0%, #000 60%); z-index: -2; }
        .big-text { font-size: 16vw; line-height: 0.75; letter-spacing: -0.05em; font-weight: 900; color: rgba(255, 255, 255, 0.03); text-shadow: -1px -1px 0 rgba(255,255,255,0.05); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 2px solid #0a0a0a; transition: 0.5s; }
        .video-container:hover { border-color: var(--accent); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Modal Animation */
        #booking-modal { display: none; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        #booking-modal.active { display: flex; }
        
        .loader { width: 48px; height: 48px; border: 3px solid #FFF; border-bottom-color: var(--accent); border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }

        /* 1. Global Reset to ensure end-to-end width */
        body, html {
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevents horizontal scroll during animations */
        }

        /* 2. Your Reveal Animation (Applied to the image) */
        .relative img {
            animation: reveal 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity; /* Smoother performance */
        }

        @keyframes reveal {
            0% { 
                opacity: 0; 
                transform: translateY(30px) scale(1.05); /* Started slightly larger to avoid edge gaps */
                filter: blur(10px); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
                filter: blur(0); 
            }
        }

        /* 3. Your Floating Effect (Applied to the group container) */
        .group {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); } /* Slightly deeper float for more 'party' vibe */
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <nav class="fixed top-0 w-full z-50 p-8 flex justify-between items-center mix-blend-difference">
        <div class="font-heading font-bold text-xl tracking-tighter">DJ OMAN 237</div>
        <div class="flex gap-10 text-[10px] uppercase tracking-[0.3em] font-semibold">
            <a href="#mixes" class="hover:text-yellow-500 transition">Media</a>
            <a href="#events" class="hover:text-yellow-500 transition">Events</a>
            <a href="/admin" class="opacity-50 hover:opacity-100">Portal</a>
        </div>
    </nav>

    <section class="h-screen w-full relative overflow-hidden bg-black flex items-center justify-center">
    
        <div class="group w-full h-full relative">
            <img src="assets/images/hero-logo.png" 
                 alt="DJ OMAN 237 MR ENTERTAINER" 
                 class="w-full h-full object-cover object-center shadow-2xl">
            
            <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/90 pointer-events-none"></div>
        </div>

        <div class="absolute bottom-12 left-0 w-full text-center z-20">
            <p class="text-[10px] tracking-[0.5em] uppercase text-yellow-500 font-bold animate-pulse">
                Premiere Mixes & Event Sound
            </p>
        </div>
    </section>

    <main class="relative z-20 px-6 lg:px-20 py-32 space-y-40">
        
        <section id="mixes">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-8">
                <h2 class="font-heading text-6xl italic font-bold">LATEST<br>RELEASES</h2>
                <div id="genre-filter" class="flex flex-wrap gap-3">
                    <button onclick="filterMixes('all')" class="px-6 py-2 rounded-full border border-white/20 text-[10px] uppercase tracking-widest hover:border-yellow-500 transition active-genre">All</button>
                    </div>
            </div>
            <div id="mix-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-12 min-h-[300px] flex justify-center items-center">
                <span class="loader"></span>
            </div>
        </section>
    
        <section id="events">
            <h2 class="font-heading text-6xl mb-16 italic font-bold">EVENT<br>GALLERIES</h2>
            <div id="event-grid" class="grid grid-cols-1 md:grid-cols-2 gap-12"></div>
        </section>
    </main>

    <div id="booking-modal" class="fixed inset-0 z-[100] items-center justify-center p-6">
        <div class="bg-[#0a0a0a] border border-white/10 p-10 rounded-3xl max-w-xl w-full relative">
            <button onclick="toggleModal()" class="absolute top-6 right-6 text-white/50 hover:text-white">&times; Close</button>
            <h2 class="font-heading text-3xl mb-2 text-yellow-500">Book Your Event</h2>
            <p class="text-white/40 text-sm mb-8">Fill in the details and we'll get back to you within 24 hours.</p>
            
            <form name="booking" method="POST" data-netlify="true" class="space-y-4 text-left">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" name="name" placeholder="Full Name" required class="bg-white/5 border border-white/10 p-4 rounded-xl w-full focus:border-yellow-500 outline-none">
                    <input type="email" name="email" placeholder="Email Address" required class="bg-white/5 border border-white/10 p-4 rounded-xl w-full focus:border-yellow-500 outline-none">
                </div>
                <select name="event-type" class="bg-white/5 border border-white/10 p-4 rounded-xl w-full focus:border-yellow-500 outline-none">
                    <option class="text-black">Wedding</option>
                    <option class="text-black">Corporate Event</option>
                    <option class="text-black">Birthday / Private Party</option>
                    <option class="text-black">Club / Concert</option>
                </select>
                <textarea name="details" rows="4" placeholder="Tell us about the event (Date, Location, etc.)" class="bg-white/5 border border-white/10 p-4 rounded-xl w-full focus:border-yellow-500 outline-none"></textarea>
                <button type="submit" class="w-full bg-yellow-500 text-black font-black py-5 rounded-xl uppercase tracking-widest hover:bg-white transition">Submit Request</button>
            </form>
        </div>
    </div>

    <footer class="p-20 bg-black border-t border-white/5 text-center flex flex-col items-center gap-8">
        <h2 class="font-heading text-4xl mb-6">Let's Talk.</h2>
        <button onclick="toggleModal()" class="px-10 py-4 bg-white text-black rounded-full text-xs font-black uppercase tracking-widest hover:bg-yellow-500 transition">Request a Booking</button>
        <div class="mt-20 opacity-20 text-[8px] tracking-[0.2em] uppercase">&copy; 2026 DJ OMAN 237.</div>
    </footer>

    <script>
        const GITHUB_USER = 'grudge7'; 
        const GITHUB_REPO = 'DJ-OMAN237';
        let allMixes = [];

        function toggleModal() {
            document.getElementById('booking-modal').classList.toggle('active');
        }

        async function fetchData(path) {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`);
            return res.ok ? await res.json() : [];
        }

        async function fetchMixes() {
            const grid = document.getElementById('mix-grid');
            const filterContainer = document.getElementById('genre-filter');
            const files = await fetchData('content/mixes');
            
            allMixes = [];
            let genres = new Set();

            for (const file of files.reverse()) {
                if (!file.name.endsWith('.md')) continue;
                const text = await (await fetch(file.download_url)).text();
                const parts = text.split('---');
                const data = jsyaml.load(parts[1]);
                if (data.youtubeId) {
                    allMixes.push(data);
                    if (data.genre) genres.add(data.genre);
                }
            }

            // Create Genre Buttons
            genres.forEach(genre => {
                filterContainer.innerHTML += `<button onclick="filterMixes('${genre}')" class="px-6 py-2 rounded-full border border-white/20 text-[10px] uppercase tracking-widest hover:border-yellow-500 transition">${genre}</button>`;
            });

            renderMixes(allMixes);
        }

        function renderMixes(mixList) {
            const grid = document.getElementById('mix-grid');
            grid.innerHTML = mixList.map(mix => `
                <div class="bg-[#080808] p-6 rounded-3xl border border-white/5 transition hover:border-yellow-500/30 group">
                    <div class="video-container mb-6 shadow-2xl">
                        <iframe src="https://www.youtube.com/embed/${mix.youtubeId.trim()}?modestbranding=1" frameborder="0" allowfullscreen loading="lazy"></iframe>
                    </div>
                    <p class="text-yellow-500 text-[10px] uppercase tracking-widest mb-2 font-bold">${mix.genre || 'MIX'}</p>
                    <h3 class="text-2xl font-bold uppercase tracking-tight break-words">${mix.title}</h3>
                </div>
            `).join('');
        }

        function filterMixes(genre) {
            const filtered = genre === 'all' ? allMixes : allMixes.filter(m => m.genre === genre);
            renderMixes(filtered);
        }

        async function fetchEvents() {
            const grid = document.getElementById('event-grid');
            const files = await fetchData('content/events');
            grid.innerHTML = '';
            for (const file of files) {
                if (file.name.endsWith('.md')) {
                    const text = await (await fetch(file.download_url)).text();
                    const data = jsyaml.load(text.split('---')[1]);
                    if (data.gallery) {
                        grid.innerHTML += `
                            <div class="group">
                                <div class="grid grid-cols-2 gap-2 mb-4 rounded-2xl overflow-hidden border border-white/5">
                                    ${data.gallery.slice(0, 4).map(img => `<img src="${img.image}" class="w-full h-48 object-cover hover:scale-110 transition duration-500">`).join('')}
                                </div>
                                <h3 class="font-heading text-xl font-bold">${data.title}</h3>
                            </div>`;
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMixes();
            fetchEvents();
        });
    </script>
</body>
</html>
